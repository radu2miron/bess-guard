spring.application.name=bessguard-backend
server.port=8081
logging.file.name=logs/bessguard-backend.log
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.file-name-pattern=logs/bessguard-backend.%d{yyyy-MM-dd}.%i.log
spring.mvc.format.date=yyyy-MM-dd

# Fabric Gateway connection params
blockchain.msp-id=Org1MSP
blockchain.channel-name=bessguard-channel
blockchain.chaincode-name=bessguard-chaincode
blockchain.crypto-path=${BESSGUARD_FABRIC_CRYPTO_PATH:/home/radu/scoala/2026-2027/Technologies2026/code/fabric-2.5.16/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com}
blockchain.cert-path=users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem
blockchain.key-dir-path=users/User1@org1.example.com/msp/keystore
blockchain.tls-cert-path=peers/peer0.org1.example.com/tls/ca.crt
blockchain.peer-endpoint=localhost:7051
blockchain.override_authority=peer0.org1.example.com

# RabbitMQ transports committed dispatch commands to the gateway, not Fabric transaction requests.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${BESSGUARD_RABBIT_USER:guest}
spring.rabbitmq.password=${BESSGUARD_RABBIT_PASSWORD:guest}
spring.rabbitmq.listener.simple.prefetch=1
rabbit.consumer.concurrency=50

# JWT login params. Change dev credentials before exposure.
authorization.enabled=true
jwt.secret-base64=${BESSGUARD_JWT_SECRET_BASE64:X6xSPJa7RJ9zuKqae5pd+9mPFZqL9KTVFyuExQ7IL9a2VNxdkx8eZX5fkl24MhWJUmiDl6nVWDc5ix0lIkXedg==}
security.accounts.admin.username=user1
security.accounts.admin.password=${BESSGUARD_ADMIN_PASSWORD:pwd1}
security.accounts.certifier.username=certifier
security.accounts.certifier.password=${BESSGUARD_CERTIFIER_PASSWORD:pwd1}
security.accounts.ems.username=ems
security.accounts.ems.password=${BESSGUARD_EMS_PASSWORD:pwd1}
security.accounts.gateway.username=gateway
security.accounts.gateway.password=${BESSGUARD_GATEWAY_PASSWORD:pwd1}

# Local scheduled dispatch simulator; no real battery hardware.
simulator.dispatch.poll-ms=1000
